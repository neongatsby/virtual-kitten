# Companion Stage — static site, nothing to build.
[build]
  publish = "."
  command = ""

# The character is content-addressed by build: the page changes, the 45 MB of
# geometry and texture does not. Cache it hard so a revisit costs one HTML GET.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_t/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The two glTF manifests name the buffers, so they follow the page, not the
# assets — a stale one would point at files that are no longer there.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The modules are fetched by the browser's own loader with ?b=<BUILD_ID>, so
# they are already cache-busted per build.
# The phone tiers live in their own directories; they are as immutable as the
# full-size set they were made from.
[[headers]]
  for = "/mid/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
