<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Companion Stage</title><style>:root{color-scheme:light}html,body{margin:0;height:100%;overscroll-behavior:none;background:#faf9f5;color:#141413;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Companion Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --ground:#0C0D10; --panel:rgba(18,20,24,.88); --panel-solid:#121418;
    --hair:#2B2F36; --hair-soft:#20242A;
    --ink:#EDEAE6; --ink-dim:#A3A8B0; --ink-faint:#6D737C;
    --clay:#D08B6B; --clay-dim:#8C5F49; --warn:#D8A657;
    color-scheme: dark;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  }
  *{box-sizing:border-box;}
  #app{position:fixed;inset:0;}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #stage.grabbable{cursor:grab;}
  #stage.grabbing{cursor:grabbing;}
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(118% 76% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.4) 79%, rgba(0,0,0,.7) 100%);
    mix-blend-mode:multiply;
  }

  .hud{
    position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;
    justify-content:space-between;gap:12px;padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));pointer-events:none;
  }
  .mark{display:flex;flex-direction:column;gap:3px;}
  .mark b{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
  .sub{font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .readout{display:flex;gap:13px;align-items:baseline;font-size:10.5px;letter-spacing:.06em;
    color:var(--ink-faint);font-variant-numeric:tabular-nums;text-align:right;}
  .readout i{font-style:normal;color:var(--ink-dim);}

  .rails{
    position:absolute;left:0;right:0;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:0 68px 0 16px;z-index:3;pointer-events:none;
  }
  .rail{
    display:flex;gap:2px;padding:3px;background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--hair-soft);border-radius:999px;
    max-width:100%;pointer-events:auto;
  }
  .rail.clips{overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;}
  .rail.clips::-webkit-scrollbar{display:none;}
  .rail.clips button{flex:none;}
  .rail.frame{opacity:.72;}
  .rail.frame button{font-size:9.5px;padding:6px 11px;}
  .rail button{
    appearance:none;border:0;background:transparent;color:var(--ink-faint);white-space:nowrap;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:999px;
    cursor:pointer;transition:color .18s ease,background .18s ease;
  }
  .rail button:hover{color:var(--ink-dim);}
  .rail button[aria-pressed="true"]{background:rgba(208,139,107,.16);color:var(--clay);}
  .rail.clips button[data-kind="move"][aria-pressed="true"]{background:rgba(127,184,138,.18);color:#8FC79A;}

  .disc{
    position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--hair-soft);color:var(--ink-dim);z-index:4;
    transition:color .18s ease,border-color .18s ease;
  }
  .disc:hover{color:var(--ink);border-color:var(--hair);}
  .disc svg{width:18px;height:18px;display:block;}

  #drawer{
    position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--panel);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-left:1px solid var(--hair-soft);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.7,.3,1);
    overflow-y:auto;overscroll-behavior:contain;z-index:5;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  #drawer.open{transform:translateX(0);}
  .drawer-head{
    position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:16px 18px 12px;
    background:linear-gradient(to bottom,var(--panel-solid) 74%,rgba(18,20,24,0));
  }
  .drawer-head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-dim);}
  .x{appearance:none;border:0;background:transparent;color:var(--ink-faint);cursor:pointer;
    font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;}
  .x:hover{color:var(--ink);}

  details{border-top:1px solid var(--hair-soft);}
  summary{
    list-style:none;cursor:pointer;padding:11px 18px;display:flex;align-items:center;gap:8px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--clay-dim);transition:color .15s ease;
  }
  summary::-webkit-details-marker{display:none;}
  summary:hover{color:var(--clay);}
  summary::before{content:"+";font-size:12px;width:9px;color:var(--ink-faint);}
  details[open] > summary::before{content:"–";}
  details[open] > summary{color:var(--clay);}
  .body{padding:2px 18px 16px;display:flex;flex-direction:column;gap:10px;}

  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 10px;}
  .row label{font-size:11.5px;color:var(--ink-dim);}
  .row .val{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
    color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .row input[type=range]{grid-column:1 / -1;}

  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:16px;
    background:transparent;cursor:pointer;margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair);border-radius:2px;}
  input[type=range]::-moz-range-track{height:2px;background:var(--hair);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:var(--ink-dim);margin-top:-4.5px;border:0;transition:background .15s ease;}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
    background:var(--ink-dim);border:0;}
  input[type=range]:hover::-webkit-slider-thumb{background:var(--clay);}
  input[type=range]:hover::-moz-range-thumb{background:var(--clay);}
  input[type=range]:focus-visible{outline:2px solid var(--clay);outline-offset:4px;border-radius:4px;}

  input[type=color]{
    -webkit-appearance:none;appearance:none;width:34px;height:20px;padding:0;
    border:1px solid var(--hair);border-radius:5px;background:transparent;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:3px;}
  input[type=color]::-moz-color-swatch{border:0;border-radius:3px;}

  select,.filebtn{
    width:100%;appearance:none;background:#0F1115;color:var(--ink);
    border:1px solid var(--hair);border-radius:7px;padding:7px 10px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;cursor:pointer;
  }
  select:focus-visible{outline:2px solid var(--clay);outline-offset:2px;}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .toggle label{font-size:11.5px;color:var(--ink-dim);cursor:pointer;}
  .switch{appearance:none;width:34px;height:19px;border-radius:999px;background:#22262C;
    border:1px solid var(--hair);position:relative;cursor:pointer;transition:background .18s ease;flex:none;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    border-radius:50%;background:var(--ink-faint);transition:transform .18s ease,background .18s ease;}
  .switch:checked{background:rgba(208,139,107,.28);border-color:var(--clay-dim);}
  .switch:checked::after{transform:translateX(15px);background:var(--clay);}
  .switch:focus-visible{outline:2px solid var(--clay);outline-offset:2px;}

  .chip{appearance:none;border:1px solid var(--hair);background:#0F1115;color:var(--ink-faint);
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.06em;
    padding:7px 10px;border-radius:6px;cursor:pointer;text-transform:uppercase;
    transition:color .15s ease,border-color .15s ease,background .15s ease;}
  .chip:hover{color:var(--ink-dim);border-color:var(--hair);}
  .actions{display:flex;gap:6px;}
  .actions .chip{flex:1;text-align:center;}
  .note{font-size:10.5px;line-height:1.55;color:var(--ink-faint);margin:0;}
  .note code{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink-dim);font-size:10px;}

  #boot{position:absolute;inset:0;z-index:8;display:grid;place-items:center;
    background:var(--ground);transition:opacity .6s ease;}
  #boot.gone{opacity:0;pointer-events:none;}
  .boot-inner{display:flex;flex-direction:column;align-items:center;gap:14px;
    max-width:min(430px,84vw);text-align:center;padding:0 16px;}
  .bar{width:170px;height:2px;background:var(--hair-soft);border-radius:2px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0%;background:var(--clay);transition:width .3s ease;}
  .boot-inner p{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
  .boot-inner .err{text-transform:none;letter-spacing:0;color:var(--warn);line-height:1.6;font-size:11.5px;}

  @media (max-width:760px){
    #drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:68svh;
      border-left:0;border-top:1px solid var(--hair);border-radius:16px 16px 0 0;
      transform:translateY(100%);}
    #drawer.open{transform:translateY(0);}
    .drawer-head{border-radius:16px 16px 0 0;}
    .rails{padding:0 58px 0 12px;}
    .rail button{padding:8px 10px;font-size:10px;}
    .disc{width:40px;height:40px;}
  }
  @media (prefers-reduced-motion:reduce){ #drawer,#boot,.rail button,.chip{transition:none;} }
</style>

<div id="app">
  <canvas id="stage"></canvas>
  <div id="vignette"></div>

  <div class="hud">
    <div class="mark">
      <b>Companion Stage</b>
      <span class="sub mono" id="assetLine">loading…</span>
    </div>
    <div class="readout mono">
      <span><i id="fps">—</i> fps</span>
      <span><i id="tris">—</i> tris</span>
      <span><i id="calls">—</i> calls</span>

  </div>

  <div class="rails">
    <div class="rail frame" role="group" aria-label="Camera framing">
      <button type="button" data-frame="full" aria-pressed="true">Full</button>

      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
      <circle cx="16" cy="7" r="2.1"/><circle cx="10" cy="17" r="2.1"/>
    </svg>
  </button>

  <aside id="drawer" aria-label="Look controls">
    <div class="drawer-head">
      <h2>Look</h2>
      <button type="button" class="x" id="closeDrawer" aria-label="Close controls">&times;</button>
    </div>
    <div id="panels"></div>
  </aside>

  <div id="boot">
    <div class="boot-inner">
      <p id="bootMsg">Loading character</p>
      <div class="bar"><i id="bootBar"></i></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* The other sessions' portable blocks, wrapped as modules by
   pipeline/wrap_blocks.py. The block text inside them is verbatim from its own
   session's copy — hairlab/blocks/ for the first four, pipeline/balance.js for
   the last — and those stay the source of truth; re-running the script is the
   whole update path.

   ⚠ The ?b= query has to be bumped with BUILD_ID below. These are fetched by
   the browser's module loader, not by the LoadingManager that stamps every
   other asset, so without it a corrected block is indistinguishable from the
   old one to the cache — the exact failure BUILD_ID exists to prevent. */
import { install as installFace } from './js/face.js?b=36';
import { install as installGaze } from './js/gaze.js?b=36';
import { install as installHair } from './js/hair.js?b=36';
import { install as installTwist } from './js/twist.js?b=36';
import { install as installBalance } from './js/balance.js?b=36';
import { install as installMood } from './js/mood.js?b=36';

const CHAR_URL  = 'companion.json';
const CLIPS_URL = 'clips.json';
const $ = (id) => document.getElementById(id);
const boot = $('boot'), bootMsg = $('bootMsg'), bootBar = $('bootBar');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function kelvinToColor(k, target){
  const t = k / 100; let r, g, b;
  if (t <= 66){
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = 255;
  }
  const c = (v) => Math.min(1, Math.max(0, v / 255));
  return target.setRGB(c(r), c(g), c(b), THREE.SRGBColorSpace);
}

/* ───────────────────────── renderer ───────────────────────── */
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.49;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.03, 120);
camera.position.set(0, 1.4, 3.0);

const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {
  enableDamping:true, dampingFactor:.055, enablePan:false,
  minDistance:.28, maxDistance:8, rotateSpeed:.62, autoRotateSpeed:.35
});
controls.minPolarAngle = THREE.MathUtils.degToRad(48);
controls.maxPolarAngle = THREE.MathUtils.degToRad(106);
controls.target.set(0, 1.1, 0);

/* ───────────────────────── environment ───────────────────────── */
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.18;
scene.environmentRotation = new THREE.Euler(0, THREE.MathUtils.degToRad(62), 0);
scene.backgroundRotation = new THREE.Euler(0, THREE.MathUtils.degToRad(62), 0);
scene.backgroundBlurriness = 0.9;
scene.backgroundIntensity = 0.5;

const sweepU = {
  uTop:{ value:new THREE.Color().setRGB(.013,.014,.019) },
  uBottom:{ value:new THREE.Color().setRGB(.085,.082,.09) },
  uPeak:{ value:.44 }
};
const sweep = new THREE.Mesh(
  new THREE.SphereGeometry(50, 32, 24),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, uniforms:sweepU,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`
      varying vec3 vP; uniform vec3 uTop; uniform vec3 uBottom; uniform float uPeak;
      void main(){
        vec3 n = normalize(vP); float h = n.y*.5+.5;
        vec3 c = mix(uBottom, uTop, smoothstep(0.,1.,pow(clamp(h,0.,1.),1.35)));
        c += uBottom * smoothstep(.62,0.,distance(vec2(n.x,h), vec2(0.,uPeak))) * 1.3;
        gl_FragColor = vec4(c,1.);
      }`
  })
);
sweep.frustumCulled = false;
scene.add(sweep);

/* ───────────────────────── three-point rig ───────────────────────── */
const key  = new THREE.DirectionalLight(0xffffff, 0.90);
const fill = new THREE.DirectionalLight(0xffffff, 4.60);
const rim  = new THREE.DirectionalLight(0xffffff, 8.75);
const rim2 = new THREE.DirectionalLight(0xffffff, 1.05);
const kick = new THREE.DirectionalLight(0xffffff, 1.80);
key.castShadow = true;
/* 2048 over a 1.9 m subject is about a millimetre a texel, and an 18 mm normal
   bias is enormous at that scale — it lifts contact shadows off the surface and
   makes them slide when the geometry under them moves, which is most of what
   reads as "something strange with the shadow" on a breast being lifted. */
key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -0.00018;
key.shadow.normalBias = 0.0045;
key.shadow.radius = 2.4;
scene.add(key, key.target, fill, fill.target, rim, rim.target,
          rim2, rim2.target, kick, kick.target);

const rig = {
  key:{ az:36, el:26, k:5600 }, fill:{ az:-58, el:12, k:7000 },
  rim:{ az:167, el:38, k:6550 }, rim2:{ az:-146, el:22, k:8200 }, kick:{ az:-63, el:-14, k:4300 }
};
function place(l, s, d){
  const a = THREE.MathUtils.degToRad(s.az), e = THREE.MathUtils.degToRad(s.el);
  l.position.set(d*Math.cos(e)*Math.sin(a), d*Math.sin(e) + controls.target.y*.4, d*Math.cos(e)*Math.cos(a));
  l.target.position.set(0, controls.target.y, 0);
  l.target.updateMatrixWorld();
}
function refreshRig(){
  place(key, rig.key, 4.2); place(fill, rig.fill, 4.6);
  place(rim, rig.rim, 4.4);  place(rim2, rig.rim2, 4.4); place(kick, rig.kick, 3.2);
  kelvinToColor(rig.key.k, key.color);
  kelvinToColor(rig.fill.k, fill.color);
  kelvinToColor(rig.rim.k, rim.color);
  kelvinToColor(rig.rim2.k, rim2.color);
  kelvinToColor(rig.kick.k, kick.color);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5, 64).rotateX(-Math.PI/2),
  new THREE.ShadowMaterial({ opacity:0.42 })
);
floor.receiveShadow = true;
scene.add(floor);

const refs = new THREE.Group(); refs.visible = false;
{
  const chrome = new THREE.Mesh(new THREE.SphereGeometry(.085,48,32),
    new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:1, roughness:.04 }));
  const grey = new THREE.Mesh(new THREE.SphereGeometry(.085,48,32),
    new THREE.MeshStandardMaterial({ color:new THREE.Color().setRGB(.18,.18,.18,THREE.SRGBColorSpace), roughness:.9 }));
  chrome.position.set(-.42,1.24,.2); grey.position.set(-.42,1.03,.2);
  chrome.castShadow = grey.castShadow = true;
  refs.add(chrome, grey);
}
scene.add(refs);

/* ───────────────────────── post ───────────────────────── */
const rt = new THREE.WebGLRenderTarget(1, 1, { type:THREE.HalfFloatType, samples:4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), 0.11, 0.12, 1.36);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let usePost = true;

/* ───────────────────────── material groups ───────────────────────── */
const GROUPS = [
  { id:'skin',  label:'Skin',      mats:['M_face','M_torso','M_arms','M_legs','M_genitalia','M_torsogen'], open:true,
    keys:['color','roughness','normalScale','aoMapIntensity','clearcoat','clearcoatRoughness',
          'sheen','sheenRoughness','sheenColor','specularIntensity','envMapIntensity'],
    d:{ color:'#ffebe5', roughness:0.92, normalScale:0.10, aoMapIntensity:0.45,
        clearcoat:0.22, clearcoatRoughness:0.265, sheen:0.60, sheenRoughness:0.18,
        sheenColor:'#ffd6c6', specularIntensity:0.63, envMapIntensity:1.0 } },

  { id:'eyes',  label:'Eyes',      mats:['M_eyes'],
    keys:['color','roughness','clearcoat','clearcoatRoughness','envMapIntensity','emissiveIntensity'],
    d:{ color:'#ffffff', roughness:0.0, clearcoat:1.0, clearcoatRoughness:0.0,
        envMapIntensity:0.84, emissiveIntensity:0.01 } },

  { id:'cornea',label:'Cornea',    mats:['M_CORNEA'],
    keys:['opacity','roughness','clearcoat','ior','transmission'],

  else { _jqw.identity(); _jf.set(0, 0, 1); }
  _jqi.copy(_jqw).invert();       // for reading displacements in her own frame

  for (const [name, driver, region, follow] of JIGGLE){
    const b = bone(name), d = bone(driver);
    if (!b || !d) continue;
    const st = jig(name); if (!st) continue;
    const R = REGION[region];
    const amount = JIG[R.slider || region];

    // no clip animates these bones, so the mixer never resets them —
    // without restoring a base, every frame's offset compounds
    b.quaternion.copy(st.base);
    b.position.copy(st.basePos);
    b.scale.copy(st.baseScale);
    // Stretched flesh does not just translate, it bunches. Scaling about the
    // bone head pushes the weighted shell outward, and because the weights
    // fall off the outer edge moves most — which reads as fat collecting on
    // the side you are pulling toward.
    let sc = R.swell ? 1 + R.swell * st.disp.length() : 1;
    if (name === 'jBelly' && JIG.bulge > 0) sc *= 1 + JIG.bulge * 1.9;
    if (sc !== 1) b.scale.multiplyScalar(sc);
    b.updateMatrixWorld(true);
    b.getWorldPosition(st.rest);
    const P = SOFT_PICK[name];
    if (P){
      st.pick.set(P.off[0], P.off[1], P.off[2]).applyQuaternion(_jqw).add(st.rest);
      st.nrm.set(P.n[0], P.n[1], P.n[2]).applyQuaternion(_jqw).normalize();
    } else {
      st.pick.copy(st.rest);
      st.nrm.set(0, 0, 1).applyQuaternion(_jqw);
    }

    if (!JIG.on){ continue; }

    d.getWorldPosition(_jp);
    if (!st.init){ st.prev.copy(_jp); st.init = true; continue; }
    _jv.subVectors(_jp, st.prev).divideScalar(h);
    _ja.subVectors(_jv, st.vel).divideScalar(h);
    st.prev.copy(_jp); st.vel.copy(_jv);
    // twice-differentiated positions at a variable timestep are noisy, and a
    // single-frame spike reads as a twitch rather than as flesh
    if (_ja.lengthSq() > 900) _ja.setLength(30);
    st.acc.lerp(_ja, 1 - Math.exp(-h * 26));

    const A = R.axis, g = Math.max(0, amount);

    // equilibrium: the bind pose normally, but a follower's rest point is
    // dragged along by whatever it hangs off — the upper thigh trails the
    // cheek above it rather than waiting for an acceleration spike
    _jt.set(0, 0, 0);
    _jr.set(0, 0, 0);
    if (follow) for (const [fn, gains, ripple] of follow){
      const fs = jigState.get(fn);
      if (!fs) continue;
      _jfv.copy(fs.disp).applyQuaternion(_jqi);
      _jfv.set(_jfv.x * gains[0], _jfv.y * gains[1], _jfv.z * gains[2]);
      _jt.add(_jfv.applyQuaternion(_jqw));
      if (ripple) _jr.addScaledVector(fs.dvel, ripple);
    }

    // forces, in m/s². Body acceleration and your grip are both applied
    // through the anisotropic compliance; the restoring spring is isotropic.
    _jd.set(st.acc.x * A[0], st.acc.y * A[1], st.acc.z * A[2])
       .multiplyScalar(-g * R.gain)
       .add(_jr);

    if (softDrag === name){
      const G = R.grip;
      _jg.subVectors(st.target, st.disp);      // daylight between finger and flesh
      const stretch = _jg.length();
      // A grip does not fail the instant you outrun it — it holds, transmits
      // everything it has for a moment, and then fails. Without this grace a
      // fast yank slipped on the first frame and delivered nothing, which is
      // the opposite of what a quick tug should feel like: now the saturated
      // force lands as an impulse and the flesh is already moving when it
      // comes free.
      st.slipT = stretch > G.slip ? st.slipT + h : Math.max(0, st.slipT - h * 2);
      if (st.slipT > 0.085){
        // outrun it — it comes out of your hand, and that is a small startle
        slipGrip();
        if (BLOCK.mood) BLOCK.mood.api.moodEvent('slip', 1);
      } else if (stretch > 1e-6){
        const fmax = G.force * Math.max(0.35, g);
        _jg.multiplyScalar(fmax * Math.tanh(G.k * stretch / fmax) / stretch);
        _jd.x += _jg.x * A[0]; _jd.y += _jg.y * A[1]; _jd.z += _jg.z * A[2];
      }
    }

    _jd.addScaledVector(_jn.subVectors(st.disp, _jt), -R.stiffness)
       .addScaledVector(st.dvel, -R.damping * JIG.damping);
    st.dvel.addScaledVector(_jd, h);
    st.disp.addScaledVector(st.dvel, h);

    // Flesh sits on top of a body, so it can slide and lift but it cannot sink
    // into what is underneath. Without this, dragging a cheek across her
    // pushed it straight through her hip.
    const maxIn = R.maxIn === undefined ? 0.02 : R.maxIn;
    const into = -st.disp.dot(st.nrm);
    if (into > maxIn){
      st.disp.addScaledVector(st.nrm, into - maxIn);
      const vin = -st.dvel.dot(st.nrm);          // kill the velocity driving it in
      if (vin > 0) st.dvel.addScaledVector(st.nrm, vin);
    }

    // a backstop, not the shape of the response — the force cap above is what
    // actually decides how far a pull gets
    const cap = R.max * (softDrag === name ? 3.2 : 1.0);
    if (st.disp.length() > cap) st.disp.setLength(cap);

    _jw.copy(st.disp);
    if (name === 'jBelly' && JIG.bulge > 0) _jw.addScaledVector(_jf, JIG.bulge * 0.052);
    if (_jw.lengthSq() < 1e-10) continue;

    b.position.copy(b.parent.worldToLocal(_jw.add(st.rest)));
    b.updateMatrixWorld(true);
  }
}

/* Per-region pick radius. A jiggle bone sits at the centre of its flesh, so the
   radius is roughly how far that flesh extends — the belly one is deliberately
   tight because the bone is buried and her forearm passes right over it. */
function softDist(ray, name){
  const st = jigState.get(name);
  if (!st || !st.init) return Infinity;
  return Math.sqrt(ray.distanceSqToPoint(st.pick));
}
function softScore(ray, name){
  const st = jigState.get(name);
  // facing test: if the region's outward normal points away from the ray, you
  // are looking at the far side of her and should not be able to take hold of
  // it through her body
  if (st && st.init && ray.direction.dot(st.nrm) > -0.12) return Infinity;
  const P = SOFT_PICK[name];
  return softDist(ray, name) / ((P && P.r) || 0.100);
}
function pickSoft(ray){
  let best = null, bestS = 1.0;
  for (const [name] of JIGGLE){
    const s = softScore(ray, name);
    if (s < bestS){ bestS = s; best = name; }
  }
  return best;
}
/* Arms and flesh compete for the same pixels — her forearm hangs directly over
   her belly from the front — so the two are scored together, in units of each
   target's own radius, rather than letting arms always win. */
function pickAny(ray){
  let bestS = 1.0, chain = null, soft = null;
  const ch = pickChain(ray);
  // Flesh wins a close call. Her forearm hangs beside her chest and over her
  // belly, so on a tie the arm was taking grabs that were plainly aimed at
  // neither; a 25% handicap settles it without making the arm hard to grab.
  if (ch){ bestS = (chainDist(ray, ch) / 0.090) * 1.25; chain = ch; }
  for (const [name] of JIGGLE){
    const s = softScore(ray, name);
    if (s < bestS){ bestS = s; soft = name; chain = null; }
  }
  /* The sternum handle is a SEGMENT from the notch to the xiphoid, not a
     sphere — her pectoral pick points sit only 8 cm either side with a 10.5 cm
     radius, so anywhere between her breasts a breast is nearer than the centre
     of any sphere small enough not to steal chest grabs. twistPick already
     returns the same normalised score the others do. */
  if (BLOCK.twist){
    const ts = BLOCK.twist.api.twistPick(ray);
    if (ts < bestS){ bestS = ts; chain = null; soft = null; return { chain: null, soft: null, twist: true }; }
  }
  return { chain, soft };
}

function segHit(ray, aName, bName){
  const A = bone(aName), B = bone(bName);
  if (!A || !B) return Infinity;
  A.getWorldPosition(_p0); B.getWorldPosition(_p1);
  return Math.sqrt(ray.distanceSqToSegment(_p0, _p1, null, _seg));
}
/* Only the forearm and hand are grabbable. The upper arm hangs right in front
   of the chest, so a shoulder-to-elbow segment kept winning picks that were
   aimed at her breast. */
const _pcA = new THREE.Vector3(), _pcB = new THREE.Vector3(), _pcD = new THREE.Vector3();
function chainDist(ray, ch){
  const M = bone(ch.mid), E = bone(ch.end);
  if (!M || !E) return Infinity;
  M.getWorldPosition(_pcA); E.getWorldPosition(_pcB);
  // start a little below the elbow and run past the wrist, so the hand itself
  // is grabbable but the elbow crease is not
  _pcD.subVectors(_pcB, _pcA);
  const L = _pcD.length();
  if (L < 1e-5) return Infinity;
  _pcD.divideScalar(L);
  _pcA.addScaledVector(_pcD, L * 0.38);
  _pcB.addScaledVector(_pcD, L * 0.42);
  return Math.sqrt(ray.distanceSqToSegment(_pcA, _pcB, null, _seg));
}
/* You have to be able to SEE what you take hold of. `chainDist` is a
   ray-to-segment distance and knows nothing about what is in front of that
   segment, so with her hands behind her back a drag across her belly took hold
   of a forearm that was not on screen — and ate the drag that should have gone
   to her. The soft-tissue picks have had a facing test from the start
   (`softScore`); `occluded` gives the arms a real one, against a capsule built
   from her own silhouette. It lives in the balance block because that is where
   everything that knows her proportions lives. */
function pickChain(ray){
  let best = null, bestD = 0.090;
  for (const ch of CHAINS){
    const d = chainDist(ray, ch);
    // _seg is where chainDist left the closest point on the segment
    if (d < bestD && !(BLOCK.balance && BLOCK.balance.api.occluded(ray, _seg))){
      bestD = d; best = ch;
    }
  }
  return best;
}
/* The AO and normal maps are baked for the bind pose. Move a breast 60 mm and
   the crease shading underneath it is painted onto a surface that no longer has
   a crease, so it travels along as a smear. Nothing can re-bake it at runtime,
   but it can be faded in proportion to how far the tissue has left the pose it
   was baked for, which is exactly when it stops being true.

   Which map matters was measured, not guessed: rendering the same 70 mm lift
   with each disabled in turn, the NORMAL map is what makes the hard dark mark
   at the nipple — switching it off very nearly removes it — the baked AO barely
   contributes, and the shadow map adds a separate broad band. So normals fade
   hard and AO gently. */
let bakedK = -1;
function fadeBaked(){
  const grp = GROUPS.find(g => g.id === 'skin');
  if (!grp || !grp.state) return;
  let d = 0;
  for (const [name] of JIGGLE){
    const st = jigState.get(name);
    if (st) d = Math.max(d, st.disp.length());
  }
  const u = Math.min(1, d / 0.075);          // 0 at rest, 1 when fully displaced
  if (Math.abs(u - bakedK) < 0.02) return;
  bakedK = u;
  const ao = (grp.state.aoMapIntensity ?? grp.d.aoMapIntensity) * (1 - 0.35 * u);
  const ns = (grp.state.normalScale    ?? grp.d.normalScale)    * (1 - 0.75 * u);
  for (const name of grp.mats){
    const m = matsByName.get(name); if (!m) continue;
    m.aoMapIntensity = ao;
    if (m.normalScale) m.normalScale.set(ns, ns);
  }
}

function pointerRay(ev){
  const r = canvas.getBoundingClientRect();
  _ray.setFromCamera({ x:((ev.clientX - r.left)/r.width)*2 - 1,
                       y:-((ev.clientY - r.top)/r.height)*2 + 1 }, camera);
  return _ray.ray;
}
let shuffle = false, shuffleEvery = 15, shuffleAcc = 0;
/* Filled in start(). Every call site is guarded on the entry being non-null, so
   a block that throws during setup takes itself out rather than the page. */
const BLOCK = { face: null, gaze: null, hair: null, twist: null, balance: null,
                mood: null };
/* Add_LookAround is OFF. It is a baked glance on a fixed cycle, and the gaze
   block now decides where she looks and commits to it — two systems aiming the
   same head disagree, and the baked one has no idea where the camera is. The
   slider is still there if it is ever wanted back. */
const ADD_DEFAULT = { Add_Blink: 1.0, Add_MouthIdle: 0.20, Add_LookAround: 0.0, Add_Smirk: 0.40 };
/* What the Layers sliders currently hold, by clip name. The gaze and face
   blocks duck Add_LookAround and Add_Smirk while they are driving, and need to
   know what weight to duck *from* — without this they would restore to a
   hard-coded guess and quietly override whatever Luca set. */
const addBase = new Map();
const LABEL = { Idle_Shy:'Shy', Idle_Sides:'At sides', Idle_Belly:'Belly',
                Idle_Sway:'Sway', Idle_HairTouch:'Hair',
                Walk_Pace:'Pace', Step_Settle:'Step' };

const gloader = new GLTFLoader(manager);

gloader.load(CHAR_URL, (gltf) => {
  charRoot = gltf.scene;
  let tris = 0, meshCount = 0;
  charRoot.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    meshCount++;
    o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    const out = list.map((m) => {
      if (!m) return m;
      if (matsByName.has(m.name)) return matsByName.get(m.name);
      const ph = toPhysical(m);
      for (const t of [ph.map, ph.normalMap, ph.roughnessMap, ph.aoMap, ph.emissiveMap])
        if (t) t.anisotropy = maxAniso;
      matsByName.set(ph.name, ph);
      return ph;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
    const g = o.geometry;
    if (g && g.index) tris += g.index.count / 3;
    else if (g) tris += g.attributes.position.count / 3;
  });
  charRoot.userData.tris = Math.round(tris);
  charRoot.userData.meshes = meshCount;
  maybeStart();
}, undefined, (err) => { console.error(err); bootFail('The character failed to load — ' + (err && err.message || err)); });

gloader.load(CLIPS_URL, (gltf) => {
  clipList = gltf.animations || [];
  maybeStart();
}, undefined, (err) => { console.error(err); clipList = []; maybeStart(); });

function maybeStart(){
  if (!charRoot || !clipList) return;
  try { start(); }
  catch (e){
    // GLTFLoader funnels exceptions thrown here into its own onError, which
    // then reports a download failure that never happened. Surface the truth.
    console.error(e);
    bootFail('Loaded, but the viewer failed to start: ' + (e && e.message || e));
  }
}

function start(){

  mixer = new THREE.AnimationMixer(charRoot);
  for (const clip of clipList){
    clipMeta.set(clip.name, { duration: clip.duration });
    if (clip.name.startsWith('Add_')){
      THREE.AnimationUtils.makeClipAdditive(clip);
      const a = mixer.clipAction(clip);
      a.blendMode = THREE.AdditiveAnimationBlendMode;
      a.setLoop(THREE.LoopRepeat, Infinity);
      a.setEffectiveWeight(ADD_DEFAULT[clip.name] ?? 1);
      addBase.set(clip.name, ADD_DEFAULT[clip.name] ?? 1);
      a.play();
      addActions.set(clip.name, a);
    } else {
      const a = mixer.clipAction(clip);
      a.setLoop(THREE.LoopRepeat, Infinity);
      baseActions.set(clip.name, a);
    }
  }
  const PREF = ['Idle_Shy','Idle_Sides','Idle_Sway','Idle_Belly','Idle_HairTouch'];
  const first = PREF.find(n => baseActions.has(n)) || [...baseActions.keys()][0];
  if (first){
    current = baseActions.get(first);
    current.setEffectiveWeight(1).play();
  }
  hipBone = charRoot.getObjectByName('hip') || null;
  charRoot.traverse(o => { if (o.isBone) bones.set(o.name, o); });
  mixer.update(0);
  charRoot.updateMatrixWorld(true);

  /* ── the portable blocks ────────────────────────────────────────────────
     Installed here and not earlier: each destructures charRoot at install
     time, and their setups measure the rig — the hair samples its own centroid
     off the cards, the face reads bone rest positions — so the world matrices
     have to be current first.

     Face before gaze, because the gaze calls into the face when she arrives on
     a look and needs the returned API to link against. */
  BLOCK.face = installFace({ THREE, bone, charRoot, addActions, addBase });
  BLOCK.twist = installTwist({ THREE, bone, charRoot, camera, canvas,
                               rotateBoneWorld, aimBone, IDENT });
  BLOCK.gaze = installGaze({ THREE, bone, charRoot, camera, rotateBoneWorld, IDENT,
                             addActions, addBase, current: () => current });
  BLOCK.hair = installHair({ THREE, bone, charRoot });
  BLOCK.balance = installBalance({ THREE, bone, bones, charRoot, camera, canvas,
                                   controls, scene, UP, aimBone, rotateBoneWorld,
                                   pointerRay, _ray, CHAINS, GRAB, jigState,
                                   /* the blink: balance drives Add_Blink itself,
                                      because a reflex is not an expression and must
                                      not go through the one-face-owner rule. */
                                   addActions,
                                   softDrag: () => softDrag });
  /* The gaze reads the roll's headFollow through this, as a bias on its own
     TARGET rather than a rotation on her neck — so the drift still arrives
     through the gaze's spring instead of being dragged by a second system. */
  BLOCK.gaze.link({ ...BLOCK.face.api, twistGazeBias: BLOCK.twist.api.twistGazeBias });
  /* Balance answers her face in her chest, so it needs both blocks' state. */
  BLOCK.balance.link({ FACE: BLOCK.face.api.FACE, GAZE: BLOCK.gaze.api.GAZE,
                       gazeState: BLOCK.gaze.api.gazeState,
                       /* The chin grab commits the gaze where it put her head,
                          and puckers her mouth through the face block's own
                          bone table — faceState says which bones are its to
                          write. Both guarded with typeof, which does NOT throw
                          on an undeclared name, so leaving either out disables
                          that half of the chin grab in total silence. */
                       gazeCommit: BLOCK.gaze.api.gazeCommit,
                       faceState: BLOCK.face.api.faceState });
  BLOCK.mood = installMood({ THREE, bone, camera, GRAB, jigState, JIG,
                             softDrag: () => softDrag });
  /* The mood reads every other block's state — what the roll did, what the
     legs did, where her eyes went — and is the only thing that turns any of it
     into a face. */
  BLOCK.mood.link({ FACE: BLOCK.face.api.FACE, GAZE: BLOCK.gaze.api.GAZE,
                    gazeState: BLOCK.gaze.api.gazeState,
                    TWIST: BLOCK.twist.api.TWIST,
                    twistState: BLOCK.twist.api.twistState,
                    BAL: BLOCK.balance.api.BAL, LEG: BLOCK.balance.api.LEG });
  /* ── the roll and the balance both want her legs ───────────────────────
     Torso roll moves her pelvis and then solves both legs to keep her feet
     planted; balance does the same job from a real support polygon, off her
     centre of mass, and can step. Run the roll FIRST and let balance see the
     moved pelvis and own the legs outright — with the roll's own settle at
     zero, so it is not computing a knee bend that is about to be overwritten
     and dropping her hip by a centimetre for it. Do not run both with
     TWIST.knee > 0: there is no ordering that makes that correct. */
  BLOCK.twist.api.TWIST.knee = 0;
  /* Balance's own head-turn is OFF, and stays off. It predates the gaze block
     and aims the same neck from a different idea of where she should be
     looking; the gaze block owns her head. Everything else balance does to her
     face — the mood, the catch, the answer in her chest — goes through
     `window.Companion.face` and does not touch the neck. */
  BLOCK.balance.api.BAL.look = 0;
  /* Warm, and not melancholy. Nothing drew on the mood tables until now — the
     face block's expressions were fired by hand or by the gaze — and the
     catalogue's `mixed` default gives her a standing chance of sad, hurt,
     worried and tired. Luca's note on that, from the balance build: it goes
     "too quickly to the one that almost looks like fear, and we never want her
     to actually look afraid". `warm` is soft / smile / grin / coy / amused /
     curious with a little wistful. Both are controls in the panel, so the rest
     of the catalogue is one pick away rather than gone. */
  BLOCK.face.api.FACE.mood = 'warm';
  BLOCK.face.api.FACE.melancholy = 0;
  /* One expression per arrival, not two. The gaze fires `random` the moment she
     lands on you; balFace fires the same instant out of her MOOD, so the look
     you get when she finds you is about what you have been doing to her. Both
     on is two faceTriggers in one frame and the second wins, which is the gaze's
     — the mood would be silently thrown away. The gaze's is the one that goes,
     since the mood version is strictly more informed. */
  BLOCK.gaze.api.GAZE.express = false;
  /* ── the hair swings less here than it did in hairlab ──────────────────
     Luca: "The hair is swaying way too much in here. Can we turn that
     setting way down by default?"

     THREE knobs, not one, because the block's own note says where the read
     comes from: `armScale` is 0.3, which "mostly takes the translation
     channel out and leaves the turn-driven twist to carry the read". So the
     sway you see is mostly `twist`, some `amp`, and — while she is just
     standing there, which is most of the time — the ambient `drift`.

     All three go to about a third, and the RATIOS BETWEEN THEM ARE KEPT:
     these are his numbers, dialled by eye in hairlab, and the balance and
     gaze layers now drive her head a great deal harder than that build did.
     What was too much is the drive, not his taste. Every one of them is a
     slider in the Hair motion panel, and the range is 4x the default, so
     there is room to put any of it back. */
  { const H = BLOCK.hair.api.HAIR;
    H.amp = 0.55;        // was 1.69 — the swing channel
    H.twist = 0.70;      // was 2.10 — the turn-driven one, which carries it
    H.drift = 0.007; }   // was 0.0155 — the ambient sway when nothing happens
  /* ── HER FACE HAS ONE OWNER ────────────────────────────────────────────
     Four systems used to fire expressions independently: the gaze on arrival,
     balance on a touch / a landing / a glance, the torso roll on a deep roll,
     and the face block's own cycle. Four writers on one face is four writers
     arguing, and the loser is whichever fired first in the frame.

     The mood block is now the only one that fires. It reads what each of the
     others DID — the roll angle, the landing, the stumble, her eyes arriving —
     and turns it into a feeling first, so the same event lands differently
     depending on what came before it. Balance keeps `balPosture` (her body
     answering her face) and `jawOpen` (a reflex, not an expression), because
     neither of those triggers anything. */
  BLOCK.balance.api.BAL.face = false;
  BLOCK.balance.api.BAL.touch = false;
  BLOCK.twist.api.TWIST.express = false;
  for (const k of ['face', 'twist', 'gaze', 'hair', 'balance', 'mood']){
    try { BLOCK[k].setup(); }
    catch (e){ console.error('block ' + k + ' failed to set up', e); BLOCK[k] = null; }
  }
  /* The balance session's probes drive the frame by hand and reach its entry
     points by bare name off __stage. Spread rather than listed, so a new one in
     that block arrives here on the next wrap without an edit here. */
  if (BLOCK.balance) Object.assign(window.__stage, BLOCK.balance.api);

  subject.add(charRoot);
  frameSubject(subject);

  for (const grp of GROUPS)
    for (const name of grp.mats){
      const mat = matsByName.get(name);
      if (!mat) continue;
      for (const k of grp.keys) applyKey(mat, k, grp.d[k]);
    }

  $('assetLine').textContent =
    `${subjectHeight.toFixed(2)} m · ${charRoot.userData.tris.toLocaleString()} tris · ` +
    `${baseActions.size + addActions.size} clips`;
  buildRail();
  buildPanels();
  if (current) markRail(current.getClip().name);
  setProgress(1);
  setTimeout(() => boot.classList.add('gone'), 260);
}

function applyGrab(dt){
  if (!GRAB.chain) return;
  const ch = GRAB.chain;

  if (GRAB.releaseT >= 0){
    GRAB.releaseT += dt / Math.max(0.05, GRAB.returnTime);
    const t = GRAB.releaseT;
    // a damped oscillation, not a fade — the limb overshoots and settles
    GRAB.weight = Math.max(-0.30, Math.exp(-4.2*t)
                                  + GRAB.wobble * Math.exp(-2.6*t) * Math.sin(10.5*t));
    if (t >= 1.35){ GRAB.chain = null; GRAB.weight = 0; GRAB.releaseT = -1; return; }
  } else {
    GRAB.weight += (1 - GRAB.weight) * Math.min(1, dt * 11);
  }

  // spring the solve target toward the cursor so the arm has some weight
  _da.subVectors(GRAB.desired, GRAB.pos).multiplyScalar(GRAB.stiffness);
  _da.addScaledVector(GRAB.vel, -GRAB.damping);
  GRAB.vel.addScaledVector(_da, Math.min(dt, 0.033));
  GRAB.pos.addScaledVector(GRAB.vel, Math.min(dt, 0.033));

  const w = GRAB.weight;
  const names = [ch.root, ch.mid, ...SPINE_PULL.map(p => p[0])];
  const anim = names.map(n => { const b = bone(n); return b ? b.quaternion.clone() : null; });

  // body follow-through: the further past comfortable reach, the more she is
  // dragged over — chest most, hips least
  const R = bone(ch.root);
  if (R){
    R.getWorldPosition(_p0);
    _db.subVectors(GRAB.pos, _p0);
    // ramps in gradually from well before full extension, so the torso leans
    // into the pull instead of arching all at once
    const u = _db.length() / Math.max(1e-4, GRAB.armLen);
    const x = Math.min(1, Math.max(0, (u - 0.58) / 0.55));
    const over = x*x*(3 - 2*x);
    if (over > 0.001){
      _db.normalize();
      _p1.copy(UP).lerp(_db, Math.min(0.42, over * GRAB.bodyPull * 0.42)).normalize();
      _qd.setFromUnitVectors(UP, _p1);
      SPINE_PULL.forEach(([n, share], i) => {
        const b = bone(n); if (!b) return;
        // slerp result must live in its own quaternion
        // each link down the spine lags the one above it, so the body settles
        // in sequence rather than as one rigid piece
        GRAB.lag[i] += (w - GRAB.lag[i]) * Math.min(1, dt * (16 - i*3.1));
        rotateBoneWorld(b, _qb.copy(IDENT).slerp(_qd, share * Math.max(0, GRAB.lag[i])));
      });
    }
  }
  solveArm(ch, GRAB.pos);

  names.forEach((n, i) => {
    const b = bone(n); if (!b || !anim[i]) return;
    _qb.copy(b.quaternion);
    b.quaternion.copy(anim[i]).slerp(_qb, w);
  });
  charRoot.updateMatrixWorld(true);
}

/* Registered on window in the capture phase: OrbitControls listens on the
   canvas, and for events targeting the canvas both its capture and bubble
   listeners fire in registration order — so the only way to get in first is
   to catch the event higher up the tree and stop it there. */
addEventListener('pointermove', (ev) => {
  if (!GRAB.on || !charRoot || ev.target !== canvas) return;
  /* Checked before GRAB.active, because a roll is not a grab as far as this
     handler is concerned — it owns the pointer without owning GRAB. */
  if (BLOCK.twist && BLOCK.twist.api.twistState.dragging){
    ev.stopPropagation(); BLOCK.twist.api.twistMove(ev); return;
  }
  if (GRAB.active){
    ev.stopPropagation();
    const ray = pointerRay(ev);
    if (!ray.intersectPlane(GRAB.plane, _p0)) return;
    if (softDrag){
      const st = jigState.get(softDrag);
      if (st) st.target.copy(_p0).add(GRAB.offset).sub(st.pick);
    } else {
      GRAB.desired.copy(_p0).add(GRAB.offset);
      /* Dragging down the screen used to drag her hand at the floor, which is
         not a direction a standing person can be led in. Below where you took
         hold of her it now reads as DEPTH instead, so straight down walks her
         toward the camera. Up still lifts her. */
      if (BLOCK.balance) BLOCK.balance.api.pullDepth(GRAB.desired);
    }
    return;
  }
  const hit = pickAny(pointerRay(ev));
  canvas.classList.toggle('grabbable', !!hit.chain || !!hit.soft || !!hit.twist);
}, true);

/* ── which button does what ────────────────────────────────────────────────
   THE LEFT BUTTON DOES EVERYTHING IT ALWAYS DID: orbit, an arm, a foot, the
   sternum handle, and her flesh. That is not negotiable and it must not be
   quietly narrowed again.

   It was, in v27, and it was wrong twice over. The balance session moved the
   soft tissue to the right button because Luca said of THAT build "of course
   when I do a left-click, it rotates her or grabs things", and I carried the
   change across to this one — where he had never asked for it, and where he
   promptly could not reach her chest or her hips at all. Worse, `ev.button` is
   0 for touch: on a phone there is no right button, so the flesh would have
   been unreachable on half the platforms this thing is for.

   The right button is now purely ADDITIVE — a second way to reach flesh that an
   arm or the sternum handle would otherwise win, for when her forearm is
   hanging over the exact place you meant. It takes nothing away. OrbitControls
   pans on right by default, so that is turned off: a right-drag that misses her
   should do nothing rather than slide the camera sideways.

   Which button decides WHAT can be picked, not merely whether. Scoring them
   together and then filtering would let the arm beat the flesh behind it and
   leave the right-drag doing nothing at all. */
let rightStroke = true;
canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());
controls.mouseButtons.RIGHT = null;
addEventListener('pointerdown', (ev) => {
  if (!GRAB.on || !charRoot || ev.target !== canvas) return;
  const ray = pointerRay(ev);
  const hit = pickAny(ray);
  const stroking = rightStroke && ev.button === 2;
  const ch = stroking ? null : hit.chain;
  const soft = stroking ? (hit.soft || pickSoft(ray)) : hit.soft;
  if (stroking) hit.twist = false;
  if (!ch && !soft && !hit.twist) return;
  ev.preventDefault();
  ev.stopPropagation();
  controls.enabled = false;

  if (hit.twist){
    canvas.classList.add('grabbing');
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    BLOCK.twist.api.twistDown(ev);
    return;
  }

  if (soft){
    const st = jigState.get(soft);
    softDrag = soft;
    GRAB.active = true;
    canvas.classList.add('grabbing');
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    camera.getWorldDirection(_da);
    GRAB.plane.setFromNormalAndCoplanarPoint(_da, st.pick);
    if (ray.intersectPlane(GRAB.plane, _p0)) GRAB.offset.subVectors(st.pick, _p0);
    else GRAB.offset.set(0, 0, 0);
    st.target.set(0, 0, 0); st.slipT = 0;
    return;
  }
  canvas.classList.add('grabbing');
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}

  const R = bone(ch.root), M = bone(ch.mid), Eb = bone(ch.end);
  R.getWorldPosition(_p0); M.getWorldPosition(_p1); Eb.getWorldPosition(_p2);
  GRAB.armLen = _p0.distanceTo(_p1) + _p1.distanceTo(_p2);
  GRAB.chain = ch; GRAB.active = true; GRAB.releaseT = -1;
  GRAB.pos.copy(_p2); GRAB.vel.set(0, 0, 0);
  GRAB.lag = [0, 0, 0, 0];
  // seed the pole from where the elbow actually is, so the solve starts from
  // her current arm shape rather than snapping to a canonical one
  _da.subVectors(_p2, _p0).normalize();
  _db.subVectors(_p1, _p0);
  GRAB.poleRef.copy(_db).addScaledVector(_da, -_da.dot(_db));
  if (GRAB.poleRef.lengthSq() < 1e-6) GRAB.poleRef.copy(ch.pole);
  GRAB.poleRef.normalize();

  camera.getWorldDirection(_da);
  GRAB.plane.setFromNormalAndCoplanarPoint(_da, _p2);
  if (ray.intersectPlane(GRAB.plane, _p0)) GRAB.offset.subVectors(_p2, _p0);
  else GRAB.offset.set(0, 0, 0);
  GRAB.desired.copy(_p2);
});

function endGrab(ev){
  if (BLOCK.twist && BLOCK.twist.api.twistState.dragging){
    BLOCK.twist.api.twistUp();
    controls.enabled = true;
    canvas.classList.remove('grabbing');
    try {
      if (ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId))
        canvas.releasePointerCapture(ev.pointerId);
    } catch (e) {}
    return;
  }
  if (!GRAB.active) return;
  GRAB.active = false;
  if (softDrag){
    // let go: the spring target snaps home and the tissue oscillates back
    const st = jigState.get(softDrag);
    if (st) st.target.set(0, 0, 0);
    softDrag = null;
    controls.enabled = true;
    canvas.classList.remove('grabbing');
    try {
      if (ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId))
        canvas.releasePointerCapture(ev.pointerId);
    } catch (e) {}
    return;
  }
  GRAB.releaseT = 0;
  controls.enabled = true;
  canvas.classList.remove('grabbing');
  try {
    if (ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId))
      canvas.releasePointerCapture(ev.pointerId);
  } catch (e) {}
}
addEventListener('pointerup', endGrab, true);
addEventListener('pointercancel', endGrab, true);

window.__stage = { GRAB, JIG, CHAINS, JIGGLE, jigState, bones, camera, controls,
                   BLOCK, addBase,
                   playBase: (n) => playBase(n), pickChain, pickSoft, pickAny, pointerRay,
                   segHit, solveArm, applyJiggle, ray: _ray,
                   get mixer(){ return mixer; }, baseActions,
                   // softDrag is module-local, so the probes need a way in
                   __softDrag: () => softDrag,
                   __setSoftDrag: (n) => { softDrag = n; },
                   slipGrip, REGION, SOFT_PICK,
                   applyGrab, endGrab, chainDist, softScore,
                   get charRoot(){ return charRoot; },
                   get current(){ return current; },
                   get rightStroke(){ return rightStroke; },
                   set rightStroke(v){ rightStroke = v; },
                   /* Probes have to own the clock. Software GL in the container
                      runs at ~1 fps and the loop clamps dt to 0.1 s, so leaving
                      it running while stepping systems by hand interleaves
                      100 ms frames with the 1/60 s ones being measured. */
                   stopLoop: () => renderer.setAnimationLoop(null),
                   renderOnce: () => { if (usePost) composer.render(0);
                                       else renderer.render(scene, camera); } };

function playBase(name, fade){
  const nxt = baseActions.get(name);
  if (!nxt || nxt === current) return;
  nxt.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).play();
  if (current) current.crossFadeTo(nxt, fade === undefined ? fadeTime : fade, false);
  current = nxt;
  markRail(name);
}

function markRail(name){
  document.querySelectorAll('#clipRail button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.clip === name)));
}

function buildRail(){
  const rail = $('clipRail');
  rail.innerHTML = '';
  const names = [...baseActions.keys()].sort((a, b) => {
    const ord = ['Idle_Shy','Idle_Sides','Idle_Sway','Idle_Belly','Idle_HairTouch',
                 'Walk_Pace','Step_Settle'];
    return (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99);
  });
  for (const n of names){
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.clip = n;
    b.dataset.kind = /^(Step|Walk)/.test(n) ? 'move' : 'idle';
    b.textContent = LABEL[n] || n.replace(/^[A-Za-z]+_/, '');
    b.setAttribute('aria-pressed', 'false');
    b.title = `${n} · ${clipMeta.get(n).duration.toFixed(1)}s`;
    b.addEventListener('click', () => { shuffleAcc = 0; playBase(n); });
    rail.appendChild(b);
  }
}

/* ───────────────────────── framing ───────────────────────── */
const FRAMES = { full:{look:.52,dist:2.3}, three:{look:.70,dist:1.5}, bust:{look:.875,dist:.92}, close:{look:.935,dist:.55} };
let currentFrame = 'full', camGoal = null;

function frameSubject(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(), c = new THREE.Vector3();
  box.getSize(size); box.getCenter(c);
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box.min.y;
  subjectHeight = size.y || 1.7;
  const r = Math.max(size.x, size.z, subjectHeight * .5) * .85 + .4;
  const sc = key.shadow.camera;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r;
  sc.near = .5; sc.far = 12; sc.updateProjectionMatrix();
  applyFrame(currentFrame, true);
}

function applyFrame(name, instant){
  currentFrame = name;
  const f = FRAMES[name];
  const y = subjectHeight * f.look;
  const d = f.dist * subjectHeight * (35 / camera.fov) * .6 + subjectHeight * .2;
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(.2, 0, 1);
  dir.normalize();
  const gt = new THREE.Vector3(0, y, 0);
  const gp = new THREE.Vector3(dir.x * d, y + subjectHeight * .035, dir.z * d);
  if (instant || reduced){ controls.target.copy(gt); camera.position.copy(gp); camGoal = null; }
  else camGoal = { pos:gp, target:gt, t:0 };
  refreshRig();
}

/* ───────────────────────── panel construction ───────────────────────── */
const TONE = { agx:THREE.AgXToneMapping, aces:THREE.ACESFilmicToneMapping,
  neutral:THREE.NeutralToneMapping, reinhard:THREE.ReinhardToneMapping, linear:THREE.LinearToneMapping };

let el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function section(title, open){
  const d = el('details'); d.open = !!open;
  d.appendChild(el('summary', null, title));
  const b = el('div', 'body');
  d.appendChild(b);
  $('panels').appendChild(d);
  return b;
}

function slider(parent, id, label, min, max, step, value, fmt, fn){
  const row = el('div', 'row');
  const lab = el('label', null, label); lab.htmlFor = id;
  const out = el('span', 'val');
  const inp = document.createElement('input');
  Object.assign(inp, { type:'range', id, min, max, step, value });
  row.append(lab, out, inp); parent.appendChild(row);
  const run = () => { const v = parseFloat(inp.value); out.textContent = fmt(v); fn(v); };
  inp.addEventListener('input', run); run();
  return inp;
}
function colour(parent, id, label, value, fn){
  const row = el('div', 'toggle');
  const lab = el('label', null, label); lab.htmlFor = id;
  const inp = document.createElement('input');
  Object.assign(inp, { type:'color', id, value });
  row.append(lab, inp); parent.appendChild(row);
  const run = () => fn(inp.value);
  inp.addEventListener('input', run); run();
  return inp;
}
function toggle(parent, id, label, value, fn){
  const row = el('div', 'toggle');
  const lab = el('label', null, label); lab.htmlFor = id;
  const inp = document.createElement('input');
  Object.assign(inp, { type:'checkbox', id, checked:value }); inp.className = 'switch';
  row.append(lab, inp); parent.appendChild(row);
  inp.addEventListener('change', () => fn(inp.checked));
  return inp;
}
function picker(parent, id, label, opts, value, fn){
  if (label){ const r = el('div','row'); const l = el('label',null,label); l.htmlFor=id; r.appendChild(l); parent.appendChild(r); }
  const s = document.createElement('select'); s.id = id;
  for (const [v, t] of opts){ const o = document.createElement('option'); o.value = v; o.textContent = t; s.appendChild(o); }
  s.value = value; parent.appendChild(s);
  s.addEventListener('change', () => fn(s.value));
  return s;
}

const state = {};  // everything the Copy-look button reports

function buildPanels(){
  /* — Motion — */
  if (baseActions.size){
    const mb = section('Motion', true);
    toggle(mb,'playing','Playing',true,v=>{
      const sp = $('speed');
      timeScale = v ? parseFloat(sp ? sp.value : 0.5) : 0;
    });
    slider(mb,'fade','Cross-fade',0.05,2.5,.01,fadeTime,v=>v.toFixed(2)+'s',v=>{ fadeTime=v; });
    slider(mb,'speed','Speed',0,2,.01,0.5,v=>v.toFixed(2)+'×',v=>{
      const pl = $('playing');
      if (!pl || pl.checked) timeScale = v;
    });
    toggle(mb,'shuffleOn','Shuffle idles',false,v=>{ shuffle=v; shuffleAcc=0; });
    slider(mb,'shuffleEvery','Shuffle every',5,40,1,15,v=>Math.round(v)+'s',v=>{ shuffleEvery=v; });
    toggle(mb,'followRoot','Follow her when she moves',true,v=>{ followRoot=v; });
    mb.appendChild(el('p','note','Pick a clip from the rail at the bottom. Shuffle drifts between the idles on its own so you can watch the transitions. Pace carries real root motion — the camera pans with her.'));
  }

  /* — Touch — */
  {
    const tb = section('Touch', true);
    tb.appendChild(el('p','note','Drag a forearm or hand — the cursor changes when you are over one. It solves to your pointer, drags her body when you pull past comfortable reach, and springs back to the animation when you let go. The upper arm is deliberately not grabbable so it cannot steal a pick aimed at her chest.'));
    toggle(tb,'grabOn','Grab enabled',true,v=>{ GRAB.on=v; if(!v) endGrab(); });
    slider(tb,'grabPull','Body follow',0,1.5,.01,GRAB.bodyPull,v=>v.toFixed(2),v=>{ GRAB.bodyPull=v; });
    slider(tb,'grabStiff','Arm stiffness',40,400,1,GRAB.stiffness,v=>Math.round(v),v=>{ GRAB.stiffness=v; });
    slider(tb,'grabDamp','Damping',6,45,.5,GRAB.damping,v=>v.toFixed(1),v=>{ GRAB.damping=v; });
    slider(tb,'grabReturn','Return time',0.15,2.5,.01,GRAB.returnTime,v=>v.toFixed(2)+'s',v=>{ GRAB.returnTime=v; });
    slider(tb,'grabWobble','Settle wobble',0,0.6,.01,GRAB.wobble,v=>v.toFixed(2),v=>{ GRAB.wobble=v; });
    tb.appendChild(el('p','note','Soft tissue grabs too \u2014 chest, either cheek, the upper thigh, the belly. Your grip is a force, not a handle: it follows you closely at first, then drags, then stops coming any further however far you go. A hip or thigh never lets go until you do; the chest will slip out of your hand if you outrun it. Everything springs back on release, and the lower body comes back heavier and slower than the chest.'));
    toggle(tb,'jigOn','Jiggle',true,v=>{ JIG.on=v; });
    slider(tb,'jigBreast','Chest',0,2,.01,JIG.breast,v=>v.toFixed(2),v=>{ JIG.breast=v; });
    slider(tb,'jigGlute','Hips',0,2,.01,JIG.glute,v=>v.toFixed(2),v=>{ JIG.glute=v; });
    slider(tb,'jigThigh','Upper thigh',0,2,.01,JIG.thigh,v=>v.toFixed(2),v=>{ JIG.thigh=v; });
    slider(tb,'jigBelly','Belly',0,2,.01,JIG.belly,v=>v.toFixed(2),v=>{ JIG.belly=v; });
    slider(tb,'jigDamp','Overall damping',0.4,2.2,.01,JIG.damping,v=>v.toFixed(2)+'×',v=>{ JIG.damping=v; });
    slider(tb,'jigBulge','Belly bulge',0,1,.005,0,v=>v.toFixed(3),v=>{ JIG.bulge=v; });
    /* How hard your fingers hold, and how far the flesh will come — the two
       numbers that set how RESPONSIVE a grab feels, as opposed to how much it
       wobbles afterwards, which is what the four sliders above do.

       Where the flesh settles is `grip.force x axis / stiffness`: the cheek's
       7.8 against 95, times its 1.35 lateral compliance, is 111 mm, which is
       exactly what it measures. `max` is the hard ceiling on top of that, and
       raising strength without raising reach just runs you into it. Both are
       multipliers on the settled per-region values, so 1.00 is untouched and
       every region keeps its own character. */
    const SOFT0 = new Map(Object.entries(REGION).map(
      ([k, r]) => [k, { force: r.grip.force, max: r.max }]));
    slider(tb,'jigGrip','Grab strength',0.4,2.5,.01,GRAB_STRENGTH0,v=>v.toFixed(2)+'×',v=>{
      for (const [k, r] of Object.entries(REGION)) r.grip.force = SOFT0.get(k).force * v;
    });
    slider(tb,'jigReach','Grab reach',0.4,2.5,.01,GRAB_REACH0,v=>v.toFixed(2)+'×',v=>{
      for (const [k, r] of Object.entries(REGION)) r.max = SOFT0.get(k).max * v;
    });
    tb.appendChild(el('p','note','Strength is how hard your fingers hold before the flesh stops coming; reach is the ceiling it stops at — and the two are not interchangeable. Where flesh settles is set by STRENGTH; reach only matters where the ceiling was cutting it short, which at 1.00 is the chest and nothing else. So reach 1.44 is what lets the chest reach its natural 55 mm instead of being clipped at 52, and strength is the only knob that moves the cheek. Measured on a full pull: strength 1.00 settles the left cheek 111 mm out, and the 0.92 it ships at gives 102 mm. Going higher buys travel and pays for it in creasing through the cleft: 111 mm adds 34 faces over 40°, 131 mm adds 50, and the animation build’s heavier paint added 232 at the same travel.'));
  }

  /* — the portable blocks ————————————————————————————————————————————
     Generated rather than hand-authored. Each block publishes a plain settings
     object of numbers and booleans, and the hair session keeps adding to them;
     a hand-written panel would be stale by the next commit and Luca would be
     tuning a subset without knowing which. The range is derived from the
     default, which is crude but honest — these are his settled values, so the
     useful span is around them. */
  /* Significant figures rather than decimal places: `toFixed(3)` renders
     TWIST.gain's whole useful range as "0.002", so the readout said nothing
     while the slider was being moved. */
  const numFmt = (x) => {
    const a = Math.abs(x);
    if (a === 0) return '0';
    if (a >= 100) return x.toFixed(0);
    if (a >= 1) return x.toFixed(2);
    return x.toPrecision(3).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  };
  function blockPanel(title, S, open, notes){
    if (!S) return;
    const b = section(title, !!open);
    if (notes) b.appendChild(el('p','note',notes));
    for (const k of Object.keys(S)){
      const v = S[k];
      if (typeof v === 'boolean'){
        toggle(b, 'bp_'+title+'_'+k, NICE_KEY[k] || k, v, (x) => { S[k] = x; });
      } else if (typeof v === 'number' && isFinite(v)){
        /* ⚠ THE STEP HAS TO DIVIDE THE DEFAULT EXACTLY. An <input type="range">
           snaps its value to a multiple of `step`, and `slider()` runs its
           callback once at creation to seed the readout — so a default that is
           not on a step gets written straight back into the block, quantised,
           the instant the panel is built. Anything smaller than half a step
           becomes ZERO.

           That is not hypothetical. The old rule was hi = max(1, |v|*3) with
           step = range/200, which gives a step of 0.005 for everything under a
           third. `TWIST.gain` is 0.0022 rad per pixel of drag — so it was set
           to 0 on page load, and the sternum drag did nothing at all from v26
           until Luca reported it. It survived every check because every test of
           the roll drove it through `Companion.twist.set()`, which never touches
           `gain`. `probe_panel_snap.py` now compares every live setting against
           a freshly imported copy of its own block and is the standing guard.

           Both ends come off the default instead: the range is 4x it, so the
           handle sits a quarter along with real headroom above, and the step is
           a four-hundredth of the range — which puts a positive default exactly
           100 steps from the floor and a negative one exactly 150. */
        const mag = Math.abs(v);
        const hi = mag < 1e-9 ? 1 : mag * 4;
        const lo = v < 0 ? -hi : 0;
        const step = (hi - lo) / 400;
        const inp = slider(b, 'bp_'+title+'_'+k, NICE_KEY[k] || k, lo, hi, step, v,
                           numFmt, (x) => { S[k] = x; });
        // the tripwire, so this class of bug announces itself next time
        if (inp && Math.abs(parseFloat(inp.value) - v) > Math.abs(v) * 1e-6){
          console.warn('panel snapped ' + title + '.' + k + ': ' + v + ' -> '
                       + inp.value + ' (step ' + step + ')');
          S[k] = v;
        }
      }
    }
    return b;
  }

  /* — Mood —————————————————————————————————————————————————————————————
     Hand-authored for the read-out. Luca: "let's make it visible for right now
     so I can track it easier" — and it is the only way to tune this by eye
     rather than by faith. The canvas is the valence/arousal plane with the
     routing boundaries drawn where they actually are, her feeling as a dot with
     a fading trail, and the slow average she is classified on as a ring. */
  if (BLOCK.mood){
    const MD = BLOCK.mood.api.MD;
    const mb = section('Mood', true);
    mb.appendChild(el('p','note','How she feels, on three clocks. The dot is what she is reacting with right now; the ring is the slow average behind it; the label is the table that average names, and that table is what her feeling then drifts back toward. Ease only ever climbs — it is how comfortable she is with you, and it decides how far up the touch arc she will go at all.'));
    const cv = document.createElement('canvas');
    cv.width = 320; cv.height = 210;
    cv.style.cssText = 'width:100%;height:auto;display:block;border-radius:8px;'
                     + 'background:rgba(0,0,0,0.20);margin:2px 0 8px';
    mb.appendChild(cv);
    BLOCK.mood.api.moodCanvas(cv);
    const l1 = el('p','note',''), l2 = el('p','note',''), l3 = el('p','note','');
    const lg = el('pre','note','');
    for (const e of [l1, l2, l3]) e.style.cssText = 'font-family:ui-monospace,monospace;margin:2px 0';
    lg.style.cssText = 'font-family:ui-monospace,monospace;font-size:11px;opacity:.65;'
                     + 'margin:6px 0 2px;white-space:pre-wrap';
    mb.append(l1, l2, l3, lg);
    setInterval(() => {
      if (!BLOCK.mood) return;
      const r = BLOCK.mood.api.moodReadout();
      l1.textContent = r.line1; l2.textContent = r.line2; l3.textContent = r.line3;
      lg.textContent = r.log.join('\n');
    }, 250);

    toggle(mb,'moodOn','Mood enabled',true,v=>{ MD.on=v; });
    toggle(mb,'moodShow','Show the plane',true,v=>{ MD.show=v; cv.style.display = v?'block':'none'; });
    toggle(mb,'moodKeepOut','Never let her look low',false,v=>{ MD.keepOut=v; });
    mb.appendChild(el('p','note','The floor is off, so a rough session genuinely reads. `worried` is still excluded outright — that is the one you ruled out. This toggle puts sad, hurt and tired back behind the fence too.'));

    mb.appendChild(el('p','note','The four dials reshape the whole event table at once, which is a great deal easier to find by feel than forty separate numbers.'));
    slider(mb,'moodWarmth','Kindness counts for',0,3,.01,MD.warmth,v=>v.toFixed(2)+'×',v=>{ MD.warmth=v; });
    slider(mb,'moodRough','Rough handling counts for',0,3,.01,MD.rough,v=>v.toFixed(2)+'×',v=>{ MD.rough=v; });

    slider(mb,'moodTau','Feeling fades in',4,120,1,MD.tau,v=>Math.round(v)+'s',v=>{ MD.tau=v; });
    slider(mb,'moodSlow','Disposition averages over',20,400,5,MD.slowTau,v=>Math.round(v)+'s',v=>{ MD.slowTau=v; });
    slider(mb,'moodHold','…and must win for',2,60,1,MD.hold,v=>Math.round(v)+'s',v=>{ MD.hold=v; });
