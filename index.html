  picker(b, 'tonemap', 'Tone mapping',
    [['agx','AgX — filmic roll-off'],['aces','ACES Filmic'],['neutral','Khronos Neutral'],
     ['reinhard','Reinhard'],['linear','Linear (no curve)']], 'agx',
    v => { state.tonemap = v; renderer.toneMapping = TONE[v];
           matsByName.forEach(m => m.needsUpdate = true); });
  state.tonemap = 'agx';
  slider(b,'exposure','Exposure',.1,3,.01,0.49,v=>v.toFixed(2),v=>{ state.exposure=v; renderer.toneMappingExposure=v; });
  toggle(b,'postOn','Bloom',true,v=>{ state.bloom=v; usePost=v; });
  slider(b,'bloomStr','Bloom strength',0,1.5,.01,.11,v=>v.toFixed(2),v=>{ state.bloomStrength=v; bloom.strength=v; });
  slider(b,'bloomRad','Bloom radius',0,1.5,.01,.12,v=>v.toFixed(2),v=>{ state.bloomRadius=v; bloom.radius=v; });
  slider(b,'bloomThr','Bloom threshold',0,2.0,.01,1.36,v=>v.toFixed(2),v=>{ state.bloomThreshold=v; bloom.threshold=v; });
  state.bloom = true;

  /* — Environment — */
  b = section('Environment');
  slider(b,'envInt','IBL intensity',0,3,.01,.18,v=>v.toFixed(2),v=>{ state.envIntensity=v; scene.environmentIntensity=v; });
  slider(b,'envRot','IBL rotation',-180,180,1,62,v=>Math.round(v)+'°',v=>{
    state.envRotation=v; const r=THREE.MathUtils.degToRad(v);
    scene.environmentRotation.y=r; scene.backgroundRotation.y=r; });
  picker(b,'bg','Backdrop',[['gradient','Studio sweep'],['void','Void'],['env','Environment']],'gradient',v=>{
    state.backdrop=v; sweep.visible=(v==='gradient');
    scene.background = v==='env' ? envRT.texture : (v==='void' ? new THREE.Color(0x0a0b0d) : null); });
  state.backdrop='gradient';
  slider(b,'bgTint','Backdrop value',0,.6,.005,.085,v=>v.toFixed(3),v=>{
    state.backdropValue=v;
    sweepU.uBottom.value.setRGB(v, v*.97, v*1.06);
    sweepU.uTop.value.setRGB(v*.15, v*.16, v*.21);
    scene.backgroundIntensity = .2 + v*3.2; });
  slider(b,'bgPeak','Sweep centre',0,1,.01,.44,v=>v.toFixed(2),v=>{ state.backdropPeak=v; sweepU.uPeak.value=v; });

  /* — lights — */
  const lightSection = (id, label, s, light, dist, defInt) => {
    const bb = section(label);
    slider(bb, id+'Int','Intensity',0,14,.05,defInt,v=>v.toFixed(2),v=>{ light.intensity=v; });
    slider(bb, id+'K','Temperature',1800,12000,50,s.k,v=>Math.round(v)+' K',v=>{ s.k=v; refreshRig(); });
    slider(bb, id+'Az','Azimuth',-180,180,1,s.az,v=>Math.round(v)+'°',v=>{ s.az=v; refreshRig(); });
    slider(bb, id+'El','Elevation',-20,88,1,s.el,v=>Math.round(v)+'°',v=>{ s.el=v; refreshRig(); });
    return bb;
  };
  const kb = lightSection('key','Key light', rig.key, key, 4.2, 0.90);
  slider(kb,'keySoft','Shadow softness',0,18,.1,4,v=>v.toFixed(1),v=>{ key.shadow.radius=v; });
  slider(kb,'shadowOpacity','Shadow density',0,1,.01,.42,v=>v.toFixed(2),v=>{ floor.material.opacity=v; });
  toggle(kb,'shadowsOn','Cast shadows',true,v=>{ renderer.shadowMap.enabled=v; matsByName.forEach(m=>m.needsUpdate=true); });
  lightSection('fill','Fill light',  rig.fill, fill, 4.6, 4.60);
  lightSection('rim', 'Rim light 1', rig.rim,  rim,  4.4, 8.75);
  lightSection('rim2','Rim light 2', rig.rim2, rim2, 4.4, 1.05);
  const kb2 = lightSection('kick','Kicker (low, warm)', rig.kick, kick, 3.2, 1.80);
  kb2.appendChild(el('p','note','Sits below eye level and throws light upward. Starts at zero — bring it up for a harder, more theatrical read.'));

  /* — material groups — */
  for (const grp of GROUPS){
    const live = grp.mats.map(n => matsByName.get(n)).filter(Boolean);
    if (!live.length) continue;
    const bb = section(grp.label, grp.open);
    grp.state = {};
    for (const k of grp.keys){
      const c = CTRL[k]; if (!c) continue;
      const id = grp.id + '_' + k;
      const dv = grp.d[k];
      if (c.type === 'color'){
        colour(bb, id, c.label, dv, v => { grp.state[k]=v; live.forEach(m => applyKey(m, k, v)); });
      } else {
        slider(bb, id, c.label, c.min, c.max, c.step, dv,
          v => v.toFixed(c.step < .01 ? 3 : 2),
          v => { grp.state[k]=v; live.forEach(m => applyKey(m, k, v)); });
      }
    }
  }

  /* — Camera — */
  b = section('Camera');
  const FILM_H = 24;
  slider(b,'fov','Focal length',16,85,1,35,
    v => Math.round(FILM_H / (2*Math.tan(THREE.MathUtils.degToRad(v)/2))) + ' mm',
    v => { state.fovDeg=v; camera.fov=v; camera.updateProjectionMatrix(); applyFrame(currentFrame, true); });
  toggle(b,'orbit','Slow orbit',false,v=>{ controls.autoRotate=v; });
  toggle(b,'grounded','Contact shadow',true,v=>{ floor.visible=v; });
  toggle(b,'refsOn','Chrome + 18% grey balls',false,v=>{ refs.visible=v; });

  /* — Performance — */
  b = section('Performance');
  picker(b,'quality','Render quality',
    [['auto','Auto — targets 60 fps'],['high','High — full DPR'],['balanced','Balanced — 1.5× cap'],['battery','Battery — 1× cap']],
    'auto', v => { autoQuality = v==='auto'; renderScale = 1;
                   dprCap = v==='battery'?1 : v==='balanced'?1.5 : 2; resize(); });

  /* — Session — */
  b = section('Session');
  const acts = el('div','actions');
  const copy = el('button','chip','Copy look JSON'); copy.type='button';
  const reset = el('button','chip','Reset'); reset.type='button';
  acts.append(copy, reset); b.appendChild(acts);
  const note = el('p','note','Dial it in, copy the JSON, paste it back to me and I will bake those values in as the defaults.');
  b.appendChild(note);
  copy.addEventListener('click', async () => {
    const json = JSON.stringify({
      render: state,
      lights: { key:{...rig.key, intensity:key.intensity}, fill:{...rig.fill, intensity:fill.intensity},
                rim:{...rig.rim, intensity:rim.intensity}, rim2:{...rig.rim2, intensity:rim2.intensity},
                kick:{...rig.kick, intensity:kick.intensity} },
      materials: Object.fromEntries(GROUPS.filter(g=>g.state).map(g => [g.id, g.state])),
      camera: { fovDeg:state.fovDeg, framing:currentFrame },
      motion: { clip: current ? current.getClip().name : null, fade: fadeTime, speed: timeScale,
                shuffle, shuffleEvery,
                layers: Object.fromEntries([...addActions].map(([n,a]) => [n, +a.getEffectiveWeight().toFixed(2)])) }
    }, null, 2);
    try { await navigator.clipboard.writeText(json);
          note.textContent = 'Copied. Paste it into the chat and I will bake it in.'; }
    catch { note.textContent = json; note.style.whiteSpace='pre-wrap';
            note.style.fontFamily='"IBM Plex Mono",monospace'; }
  });
  reset.addEventListener('click', () => location.reload());
}

/* ───────────────────────── chrome wiring ───────────────────────── */
document.querySelectorAll('.rail.frame button').forEach(bn => {
  bn.addEventListener('click', () => {
    document.querySelectorAll('.rail.frame button').forEach(o => o.setAttribute('aria-pressed', String(o === bn)));
    applyFrame(bn.dataset.frame, false);
  });
});
const drawer = $('drawer'), openBtn = $('openDrawer');
const setDrawer = (open) => { drawer.classList.toggle('open', open); openBtn.setAttribute('aria-expanded', String(open)); };
openBtn.addEventListener('click', () => setDrawer(!drawer.classList.contains('open')));
$('closeDrawer').addEventListener('click', () => setDrawer(false));
addEventListener('keydown', e => {
  if (e.key === 'Escape') setDrawer(false);
  if (e.key.toLowerCase() === 'l' && !e.metaKey && !e.ctrlKey && e.target === document.body)
    setDrawer(!drawer.classList.contains('open'));
});

/* ───────────────────────── resize + loop ───────────────────────── */
let dprCap = 2, autoQuality = true, renderScale = 1;
function resize(){
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const dpr = Math.min(devicePixelRatio || 1, dprCap) * renderScale;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr); composer.setSize(w, h);
  bloom.setSize(w * dpr, h * dpr);
}
addEventListener('resize', resize, { passive:true });
if (window.visualViewport) visualViewport.addEventListener('resize', resize, { passive:true });
resize();
refreshRig();

const fpsEl = $('fps'), trisEl = $('tris'), callsEl = $('calls');
let frames = 0, acc = 0, last = performance.now(), fpsAvg = 60;

renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(.1, (now - last) / 1000);
  last = now;
  if (camGoal){
    camGoal.t = Math.min(1, camGoal.t + dt / .55);
    const e = 1 - Math.pow(1 - camGoal.t, 3);
    camera.position.lerp(camGoal.pos, e * .28);
    controls.target.lerp(camGoal.target, e * .28);
    if (camGoal.t >= 1) camGoal = null;
  }
  /* ── the bracket ───────────────────────────────────────────────────────
     Put the animated base back, let the mixer write whatever tracks it owns,
     then capture the result: that IS the animated pose by construction, on any
     clip, whether or not it animates the hips and whether or not it is paused.
     Every layer below restores from this rather than guessing what the mixer
     touched — guessing quietly built each frame on the last one, and applyGrab
     had the same bug and did not know it: pause playback, drag an arm, and she
     folded in half within a couple of seconds. The bracket covers her spine and
     arms as well as the legs, so that is fixed too. */
  if (BLOCK.balance) BLOCK.balance.api.balRestore();
  if (mixer && timeScale > 0){
    mixer.update(dt * timeScale);
    if (shuffle && baseActions.size > 1){
      shuffleAcc += dt * timeScale;
      if (shuffleAcc >= shuffleEvery){
        shuffleAcc = 0;
        const pool = [...baseActions.keys()].filter(n => n.startsWith('Idle_') &&
                     baseActions.get(n) !== current);
        /* Which idle she drifts into is a disposition, not a coin toss — shy
           and sides when she has gone quiet, sway and hair when she is up. */
        if (pool.length)
          playBase(BLOCK.mood ? BLOCK.mood.api.moodClip(pool)
                              : pool[(Math.random() * pool.length) | 0]);
      }
    }
  }
  if (BLOCK.balance) BLOCK.balance.api.balCapture();
  /* Layer order, and every step of it is load-bearing:
       base clip -> additive layers   (the mixer, above, inside the bracket)
       grab                            runtime override, the arm you are holding
       twist                           torso roll; BEFORE balance, which then
                                       sees the moved pelvis and solves the legs
                                       under it (TWIST.knee is 0 for this)
       balance                         pelvis, legs, steps; BEFORE applyJiggle so
                                       the flesh feels her steps — the corollary
                                       is that a jerky step planner shows up as a
                                       twitch in her chest, which is a free
                                       correctness check
       gaze                            she decides where to look and turns to it;
                                       after balance, which may have turned her
       mood                            reads what every layer above just did and
                                       decides what she feels about it; the only
                                       thing in the build that fires a face
       face                            applies whatever mood triggered, this
                                       frame rather than the next
       jiggle                          physics, and it reads the head the gaze wrote
       hair                            last, because it reads everything above
       balFollow                       the camera, after she has finished moving */
  applyGrab(dt);
  if (BLOCK.twist) BLOCK.twist.apply(dt);
  if (BLOCK.balance) BLOCK.balance.apply(dt);
  if (BLOCK.gaze) BLOCK.gaze.apply(dt);
  if (BLOCK.mood) BLOCK.mood.apply(dt);
  if (BLOCK.face) BLOCK.face.apply(dt);
  applyJiggle(dt);
  fadeBaked();
  if (BLOCK.hair) BLOCK.hair.apply(dt);
  /* The camera follow used to live inside the mixer block. It has to run after
     the balance pass, because she may have walked during it, and it has to run
     whether or not a clip is playing — that block only ran while the mixer was
     advancing, so pausing playback and leading her away lost her off the side
     of the frame. */
  if (followRoot){
    if (BLOCK.balance) BLOCK.balance.api.balFollow(dt);
    else if (hipBone){
      hipBone.getWorldPosition(_fv);
      const k = Math.min(1, dt * 2.4);
      const dx = (_fv.x - controls.target.x) * k;
      controls.target.x += dx;
      camera.position.x += dx;
    }
  }
  controls.update();
  if (usePost) composer.render(dt); else renderer.render(scene, camera);

  frames++; acc += dt;
  if (acc >= .5){
    const fps = frames / acc;
    fpsAvg = fpsAvg * .6 + fps * .4;
    fpsEl.textContent = Math.round(fps);
    trisEl.textContent = renderer.info.render.triangles.toLocaleString();
    callsEl.textContent = renderer.info.render.calls;
    frames = 0; acc = 0;
    if (autoQuality){
      if (fpsAvg < 46 && renderScale > .6){ renderScale = Math.max(.6, renderScale - .12); resize(); }
      else if (fpsAvg > 58 && renderScale < 1){ renderScale = Math.min(1, renderScale + .06); resize(); }
    }
  }
});
canvas.addEventListener('wheel', e => e.preventDefault(), { passive:false });
</script>
